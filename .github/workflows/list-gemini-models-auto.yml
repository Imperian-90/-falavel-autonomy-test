name: List Gemini models
on:
  push:
    paths: ['.github/workflows/list-gemini-models-auto.yml']
permissions:
  contents: read
# trigger
jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch models
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - <<'PY'
          import json, os, urllib.request, urllib.parse
          key=os.environ['GEMINI_API_KEY']
          url='https://generativelanguage.googleapis.com/v1beta/models?key='+urllib.parse.quote(key,safe='')
          with urllib.request.urlopen(url,timeout=60) as r: data=json.load(r)
          out=[]
          for m in data.get('models',[]):
              if 'generateContent' in m.get('supportedGenerationMethods',[]):
                  out.append({'name':m.get('name'),'displayName':m.get('displayName'),'inputTokenLimit':m.get('inputTokenLimit'),'outputTokenLimit':m.get('outputTokenLimit')})
          open('models.json','w').write(json.dumps(out,indent=2))
          print(json.dumps(out,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: gemini-model-list
          path: models.json
          retention-days: 2
